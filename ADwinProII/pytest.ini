[pytest]
# user_devices is a PEP 420 namespace package (no __init__.py), so pytest's
# default "prepend" import mode would import this package under the bare name
# "ADwinProII" while the test modules import the same files as
# "user_devices.ADwinProII...". labscript_utils's double-import guard
# (h5_lock / double_import_denier) correctly flags that as the same file
# imported twice. --import-mode=importlib avoids the sys.path mutation and the
# bare-name import. Matches user_devices/AravisCamera/pytest.ini.
addopts = --import-mode=importlib

# testing/ also holds example_buffered.py, example_manual.py and Analogin.py,
# which are hardware scripts rather than test modules. They do not match this
# glob, and neither the glob nor the default "*_test.py" should start picking
# them up.
python_files = test_*.py
