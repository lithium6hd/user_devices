[pytest]
# Pytest's default "prepend" import mode inserts each ancestor directory
# with an __init__.py onto sys.path and imports it under a bare top-level
# name (here "AravisCamera") so it can build a Package collector. Since
# user_devices is a PEP 420 namespace package (no __init__.py), and the
# test module itself imports this same code as "user_devices.AravisCamera...",
# labscript_utils's double-import guard (h5_lock / double_import_denier)
# correctly flags the same file being imported under two different names.
# --import-mode=importlib avoids sys.path mutation and bare-name imports,
# so the module is only ever imported as "user_devices.AravisCamera...".
addopts = --import-mode=importlib

# testing/ deliberately holds non-test helper scripts as well as tests:
# aravis_smoke_test.py, and connection_table_aravis_test.py in a later task.
# Both match pytest's default python_files glob "*_test.py" and both import
# hardware libraries (gi/Aravis) at module level, so on a machine without
# Aravis installed, collecting them raises ModuleNotFoundError and aborts
# the entire run before any real test executes. Restricting the glob to
# "test_*.py" (the convention both real test modules already follow) keeps
# these helper scripts out of collection entirely.
python_files = test_*.py
